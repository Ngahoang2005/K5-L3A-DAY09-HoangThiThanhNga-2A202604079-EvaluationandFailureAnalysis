# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in
# docs/failure_taxonomy.md. Every mechanism maps to an existing FM; none is UNMAPPED.
ticket_over_db: FM-03          # ticket text overrides a DB fact (injection, false delay, authority)
stale_policy: FM-06            # superseded / not-yet-effective clause treated as current
clause_sum: FM-04              # sums clause parts instead of taking the applicable one
double_deduct: FM-05           # subtracts a prior refund that the host subtracts again
sibling_refund: FM-07          # refunds a sibling claim on the same order
denied_ignored: FM-02          # host/approval says no, agent still reports resolved
reply_ledger_mismatch: FM-08   # reply quotes an amount the ledger did not record
cross_principal: FM-09         # one principal reads or acts on another principal's data
